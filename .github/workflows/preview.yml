name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [demo/main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
  NEON_BRANCH: preview/pr-${{ github.event.pull_request.number }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  preview:
    name: Preview environment
    # Secrets never reach pull requests from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set the default Git branch name
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Neon CLI
        run: npm install -g --allow-scripts=esbuild neon@8.8.0

      - name: Create Neon preview branch
        id: neon
        run: |
          existing=$(neon branches list --project-id "$NEON_PROJECT_ID" --output json | jq -r --arg name "$NEON_BRANCH" '.[] | select(.name == $name) | .id')
          neon checkout "$NEON_BRANCH" --create --project-id "$NEON_PROJECT_ID"
          node -e 'const {parseEnv}=require("node:util");for (const v of Object.values(parseEnv(require("node:fs").readFileSync(".env.local","utf8")))) if (v) console.log("::add-mask::"+v)'
          branch_id=$(neon branches list --project-id "$NEON_PROJECT_ID" --output json | jq -r --arg name "$NEON_BRANCH" '.[] | select(.name == $name) | .id')
          default_id=$(neon branches list --project-id "$NEON_PROJECT_ID" --output json | jq -r '.[] | select(.default) | .id')
          if [ -z "$branch_id" ] || [ "$branch_id" = "$default_id" ]; then
            echo "::error::Preview branch resolved to '$branch_id', which is empty or the production branch."
            exit 1
          fi
          echo "branch_id=$branch_id" >> "$GITHUB_OUTPUT"
          echo "existed=$([ -n "$existing" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Run Drizzle migration on the preview branch
        run: npx drizzle-kit migrate

      - name: Post schema diff
        uses: neondatabase/schema-diff-action@80cfa8521628e890015b60f5291a7738926617dc # v1.0.1
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          compare_branch: ${{ env.NEON_BRANCH }}
          base_branch: main
          api_key: ${{ env.NEON_API_KEY }}

      # A new branch gets the PR's Functions when checkout applies neon.ts; an existing one does not.
      - name: Deploy Functions to the preview branch
        if: steps.neon.outputs.existed == 'true'
        run: neon deploy --branch "$NEON_BRANCH" --project-id "$NEON_PROJECT_ID" --yes

      # Every branch has its own Realtime secret, and Functions don't receive it automatically.
      - name: Give the Function the branch's Realtime secret
        run: |
          secret=$(node -e 'const {parseEnv}=require("node:util");const v=parseEnv(require("node:fs").readFileSync(".env.local","utf8")).NEON_REALTIME_SECRET;if(!v){console.error("NEON_REALTIME_SECRET missing from .env.local");process.exit(1)}console.log(v)')
          neon functions deploy imagegen --src src/index.ts --env "REALTIME_SECRET=$secret" \
            --branch "$NEON_BRANCH" --project-id "$NEON_PROJECT_ID" > /dev/null

      - name: Deploy web preview to Vercel
        id: vercel
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          eval "$(node -e 'const {parseEnv}=require("node:util");const e=parseEnv(require("node:fs").readFileSync(".env.local","utf8"));for (const k of ["NEON_AUTH_BASE_URL","NEON_FUNCTION_IMAGEGEN_BASE_URL","NEON_REALTIME_URL"]) { if (!e[k]) { console.error(k+" missing from .env.local"); process.exit(1) } console.log("export "+k+"="+JSON.stringify(e[k])) }')"
          NEON_AUTH_COOKIE_SECRET="$(openssl rand -base64 32)"
          echo "::add-mask::$NEON_AUTH_COOKIE_SECRET"
          url=$(node scripts/vercel-deploy.mjs \
            NEON_AUTH_BASE_URL="$NEON_AUTH_BASE_URL" \
            NEON_AUTH_COOKIE_SECRET="$NEON_AUTH_COOKIE_SECRET" \
            NEXT_PUBLIC_AGENT_URL="$NEON_FUNCTION_IMAGEGEN_BASE_URL" \
            NEXT_PUBLIC_NEON_REALTIME_URL="$NEON_REALTIME_URL")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Neon Auth and Realtime on the branch inherit production's origins; the preview URL is new for every deploy.
      - name: Trust the preview domain in Neon Auth and Realtime
        env:
          URL: ${{ steps.vercel.outputs.url }}
          BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
        run: |
          neon api "/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID/auth/domains" -X POST -f domain="$URL" -f auth_provider=better_auth > /dev/null
          origins=$(neon api "/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID/realtime" | jq -r '.allowed_origins[]')
          args=()
          for origin in $(printf "%s\n" $origins "$URL" | sort -u); do args+=(--allowed-origin "$origin"); done
          neon realtime enable --branch "$BRANCH_ID" --project-id "$NEON_PROJECT_ID" "${args[@]}" > /dev/null

      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.vercel.outputs.url }}
          BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
        run: |
          body=$(printf '<!-- factory-preview -->\n### Preview environment\n\n| | |\n|---|---|\n| App | %s |\n| Neon branch | `%s` (`%s`) |\n| Workflow run | %s |\n' \
            "$URL" "$NEON_BRANCH" "$BRANCH_ID" "${{ github.run_id }}")
          existing=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- factory-preview -->"))) | .id][0] // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi
