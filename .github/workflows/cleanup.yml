name: Cleanup preview

on:
  pull_request:
    types: [closed]
    branches: [demo/main]

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete Neon preview branch
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_BRANCH: preview/pr-${{ github.event.pull_request.number }}
    steps:
      - name: Install Neon CLI
        run: npm install -g neon@8.4.3

      - name: Delete Neon preview branch
        run: |
          id=$(neon branches list --project-id "$NEON_PROJECT_ID" --output json | jq -r --arg name "$NEON_BRANCH" '.[] | select(.name == $name) | .id')
          if [ -z "$id" ]; then
            echo "$NEON_BRANCH is already gone."
            exit 0
          fi
          neon branches delete "$id" --project-id "$NEON_PROJECT_ID"
